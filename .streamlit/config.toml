[theme]
primaryColor = "#3B82F6"
backgroundColor = "#0B0D14"
secondaryBackgroundColor = "#141721"
textColor = "#E2E8F0"
font = "sans serif"

[server]
fileWatcherType = "none"
headless = true
address = "0.0.0.0"
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 25
maxMessageSize = 25

[client]
showErrorDetails = "type"
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
